services:
  farmer:
    image: ${FARMER_IMAGE:-imstevelin/ilovefood-openpoint-farmer:2026.09}
    container_name: ilovefood-op-farmer
    privileged: true
    restart: unless-stopped
    cpus: ${FARMER_CPUS:-1.0}
    mem_limit: ${FARMER_MEMORY_LIMIT:-1280m}
    pids_limit: 2048
    stop_grace_period: 30s
    ports:
      - "${FARMER_API_BIND:-127.0.0.1}:${FARMER_API_PORT:-5000}:5000"
      - "127.0.0.1:${FARMER_ADB_PORT:-5555}:5555"
    environment:
      FARMER_API_KEY_FILE: /run/secrets/farmer_api_key
      FARMER_BIND_HOST: 0.0.0.0
      FARMER_TOKEN_TTL_SECONDS: ${FARMER_TOKEN_TTL_SECONDS:-240}
      FARMER_TOKEN_REFRESH_SECONDS: ${FARMER_TOKEN_REFRESH_SECONDS:-180}
      FARMER_MIN_HOST_AVAILABLE_MIB: ${FARMER_MIN_HOST_AVAILABLE_MIB:-128}
    secrets:
      - source: farmer_api_key
        target: /farmer-rootfs/run/secrets/farmer_api_key
        mode: 0440
    volumes:
      - farmer-data:/data
    tmpfs:
      - /cache:size=64m,mode=0770

secrets:
  farmer_api_key:
    file: ./private/farmer_api_key.txt

volumes:
  farmer-data:
    name: ilovefood-op-farmer-data
