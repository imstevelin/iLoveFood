<div class="dialog-container">
  <div class="image-loading-state" [class.is-hidden]="isLoaded" role="status" aria-live="polite">
    <span class="image-loading-glow" aria-hidden="true"></span>
    <span>圖片載入中</span>
  </div>
  <img [src]="imageSrc" class="dialog-image" [class.is-loaded]="isLoaded"
       (load)="onImageLoad()" (error)="onImageError()" alt="商品圖片">
  
  <button type="button" class="modern-close-btn" (click)="closeDialog()" aria-label="關閉圖片">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
