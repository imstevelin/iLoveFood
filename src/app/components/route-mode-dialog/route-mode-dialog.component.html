<div class="route-dialog">
  
  <!-- Icon & Title -->
  <div class="route-dialog-heading animate-fade-in-up">
    <div class="route-dialog-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
        <path d="M228.92,49.69a8,8,0,0,0-6.86-1.45L160.93,63.52,99.58,32.84a8,8,0,0,0-7.16,0L27.08,65.18A8,8,0,0,0,24,72.35V206.31a8,8,0,0,0,10.92,7.45l61.15-15.29,61.35,30.68a8,8,0,0,0,7.16,0l65.34-32.34A8,8,0,0,0,232,189.65V56.35A8,8,0,0,0,228.92,49.69ZM96,49.33l56,28V206.67l-56-28ZM40,78.22l40-18.46V187.12L40,197.12Zm176,99.56-40,19.8V88.88l40-10Z"></path>
      </svg>
    </div>
    <div>
      <h2>沿路找折扣品</h2>
      <p>使用 Google Maps 的分享連結，找出真正順路的門市。</p>
    </div>
  </div>

  <div class="route-step">
    <div class="route-step-label"><span>1</span> 貼上路線分享連結</div>
    <div class="route-url-box" [class.has-error]="urlError">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
        <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12ZM8 13h8v-2H8v2Zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10Z"/>
      </svg>
      <input type="url"
             [formControl]="routeUrlCtrl"
             (input)="onRouteUrlInput()"
             placeholder="https://maps.app.goo.gl/…"
             inputmode="url"
             autocomplete="off"
             aria-label="Google Maps 路線分享連結" />
    </div>
    <p class="route-field-help" *ngIf="!urlError">Google Maps「分享」→「複製連結」</p>
    <p class="route-field-error" *ngIf="urlError">{{ urlError }}</p>
  </div>

  <!-- Product Keyword Search Box -->
  <div class="route-step">
    <div class="route-step-label"><span>2</span> 想找什麼？<em>可略過</em></div>
    <div class="route-search-box">
      <!-- 放大鏡 icon：固定在左側不會被擠壓 -->
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"
        class="route-search-icon">
        <path
          d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z">
        </path>
      </svg>

      <!-- Chips + Input 區域：可換行、不會溢出 -->
      <div class="route-search-chips-area">
        <mat-chip-grid #chipGrid aria-label="商品多項選擇" class="route-chip-grid">
          <mat-chip-row *ngFor="let keyword of selectedKeywords" (removed)="removeKeyword(keyword)"
            class="route-chip">
            <span class="route-chip-text">{{ keyword }}</span>
            <button matChipRemove aria-label="移除關鍵字">
              <mat-icon class="route-chip-remove-icon">cancel</mat-icon>
            </button>
          </mat-chip-row>
          
          <input placeholder="例如：便當、義大利麵"
                 #keywordInput
                 [formControl]="keywordCtrl"
                 [matChipInputFor]="chipGrid"
                 [matAutocomplete]="auto"
                 [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                 (matChipInputTokenEnd)="addToken($event)"
                 class="route-search-input" />
        </mat-chip-grid>
      </div>
      
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)" class="route-autocomplete-panel">
        <mat-option *ngFor="let option of filteredOptions$ | async" [value]="option.name" class="route-autocomplete-option">
          <div *ngIf="option.type === 'category'" class="flex items-center gap-2 py-1">
            <span class="text-xs px-1.5 py-0.5 rounded-md bg-green-50 text-green-600">📂</span>
            <div class="flex flex-col">
              <span class="text-sm">{{ option.name }}</span>
              <span class="text-xs text-gray-400 dark:text-zinc-400 leading-none">{{ option.addr }}</span>
            </div>
          </div>
          <div *ngIf="option.type === 'product'" class="flex items-center gap-2 py-1">
            <span class="text-xs px-1.5 py-0.5 rounded-md bg-orange-50 text-orange-600">🍱</span>
            <div class="flex flex-col">
              <span class="text-sm">{{ option.name }}</span>
              <span class="text-xs text-gray-400 dark:text-zinc-400 leading-none">{{ option.addr }}</span>
            </div>
          </div>
        </mat-option>
      </mat-autocomplete>
    </div>
  </div>

  <!-- Mode Selection Buttons -->
  <div class="route-step">
    <div class="route-step-label"><span>3</span> 選擇交通方式並開始</div>
    <div class="route-mode-actions">
      <!-- Motorcycle Option -->
      <button type="button" class="mode-btn" (click)="selectMode('TWO_WHEELER')">
        <span class="mode-icon mode-icon-scooter" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/>
            <path d="M8.5 17h5.2l2.1-6H13l-2-3H8.5M16 8h2.5l1 3"/>
          </svg>
        </span>
        <span class="mode-copy"><strong>機車（Beta）</strong><small>使用 Google 機車路線；結果可能缺少部分道路，請依現場交通規則行駛</small></span>
        <svg class="mode-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    
      <!-- Car Option -->
      <button type="button" class="mode-btn" (click)="selectMode('DRIVING')">
        <span class="mode-icon mode-icon-car" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 16 1-5.2A2.3 2.3 0 0 1 8.3 9h7.4a2.3 2.3 0 0 1 2.3 1.8l1 5.2"/>
            <path d="M4 16h16v3H4zM7 19v2M17 19v2M7.5 13h.01M16.5 13h.01"/>
          </svg>
        </span>
        <span class="mode-copy"><strong>汽車</strong><small>略過交流道與高架路段，專注可停靠路段</small></span>
        <svg class="mode-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    </div>
  </div>
  
  <button type="button" class="dialog-cancel-btn" (click)="onCancel()">
    取消
  </button>
</div>
