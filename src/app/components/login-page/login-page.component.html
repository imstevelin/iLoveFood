<div class="login-wrapper"
  appMotion [initial]="{ scale: 0.96, opacity: 0 }"
  [animate]="{ scale: 1, opacity: 1 }"
  [transition]="{ type: 'spring', stiffness: 300, damping: 26 }">
  <header class="login-heading">
    <span class="login-icon-badge" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 10V8a5 5 0 0 1 10 0v2"/><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M12 14v3"/>
      </svg>
    </span>
    <span class="login-heading-copy"><small>收藏與同步</small><h2>快速登入</h2></span>
    <button type="button" (click)="close(false)" aria-label="關閉登入視窗" class="close-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </header>

  <p class="login-intro">
    {{ verificationSent ? '輸入簡訊中的 6 碼驗證碼，完成後即可管理收藏門市。' : '用手機號碼安全登入，不需另外設定密碼。' }}
  </p>

  <form [formGroup]="authForm" (ngSubmit)="submitForm()" class="login-form">
    <div *ngIf="!verificationSent" class="login-field-group">
      <label for="phone">手機號碼</label>
      <div class="input-shell">
        <span class="input-leading-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M10 18h4"/></svg>
        </span>
        <input type="tel" id="phone" formControlName="phone" placeholder="0912 345 678" maxlength="10"
          inputmode="numeric" autocomplete="tel" class="input-field" />
      </div>
      <small class="field-error" *ngIf="f['phone'].touched && f['phone'].errors?.['required']">請輸入手機號碼</small>
      <small class="field-error" *ngIf="f['phone'].touched && f['phone'].errors?.['pattern']">請輸入 09 開頭的 10 碼手機號碼</small>
    </div>

    <div *ngIf="verificationSent" class="login-field-group">
      <div class="field-label-row">
        <label for="code">簡訊驗證碼</label>
        <button type="button" class="edit-phone-btn" (click)="editPhone()">更換手機號碼</button>
      </div>
      <div class="input-shell code-input-shell">
        <span class="input-leading-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v14H5zM8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"/></svg>
        </span>
        <input type="text" id="code" formControlName="code" placeholder="6 碼驗證碼" maxlength="6"
          inputmode="numeric" autocomplete="one-time-code" class="input-field code-input" />
      </div>
      <small class="field-error" *ngIf="f['code'].touched && f['code'].invalid">請輸入 6 碼數字驗證碼</small>
    </div>

    <section class="captcha-section" [class.captcha-complete]="verificationSent" aria-label="安全驗證">
      <div class="captcha-heading">
        <span>安全驗證</span>
        <small *ngIf="captchaLoading">載入中…</small>
        <small *ngIf="!captchaLoading && !captchaReady && !verificationSent">請完成下方驗證</small>
        <small *ngIf="captchaReady && !verificationSent">驗證完成，可以傳送</small>
        <small *ngIf="verificationSent">已完成</small>
      </div>
      <div class="captcha-viewport" [attr.aria-busy]="captchaLoading"><div id="phone-recaptcha"></div></div>
      <p>簡訊登入由 Firebase 提供，驗證用於防止簡訊濫用。</p>
    </section>

    <div *ngIf="errorMessage" class="error-wrapper" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>
      <span>{{ errorMessage }}</span>
    </div>

    <button type="submit" [disabled]="isSubmitting || (!verificationSent && !captchaReady)" class="login-btn">
      <span>{{ isSubmitting ? '處理中…' : (verificationSent ? '驗證並登入' : '傳送驗證碼') }}</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M14 7l5 5-5 5"/></svg>
    </button>
    <small class="sms-note" *ngIf="!verificationSent">可能產生一般簡訊費用</small>
  </form>
</div>
