<div class="login-wrapper"
  appMotion [initial]="{ scale: 0.96, opacity: 0 }"
  [animate]="{ scale: 1, opacity: 1 }"
  [transition]="{ type: 'spring', stiffness: 300, damping: 26 }">
  <header class="login-heading">
    <span class="login-icon-badge" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>
      </svg>
    </span>
    <span class="login-heading-copy"><small>收藏與同步</small><h2>快速登入</h2></span>
    <button type="button" (click)="close(false)" aria-label="關閉登入視窗" class="close-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </header>

  <p class="login-intro">使用友善超人帳號同步收藏，不再需要機器人或簡訊驗證。</p>

  <div class="mode-switch" role="tablist" aria-label="登入方式">
    <button type="button" role="tab" [attr.aria-selected]="!isRegisterMode"
      [class.active]="!isRegisterMode" (click)="setMode(false)">登入</button>
    <button type="button" role="tab" [attr.aria-selected]="isRegisterMode"
      [class.active]="isRegisterMode" (click)="setMode(true)">建立帳號</button>
  </div>

  <form [formGroup]="authForm" (ngSubmit)="submitForm()" class="login-form">
    <div class="login-field-group">
      <label for="username">帳號</label>
      <div class="input-shell">
        <span class="input-leading-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M6 20a6 6 0 0 1 12 0"/></svg>
        </span>
        <input type="text" id="username" formControlName="username" placeholder="3–32 個英數字"
          maxlength="32" autocapitalize="none" spellcheck="false" autocomplete="username" class="input-field" />
      </div>
      <small class="field-error" *ngIf="f['username'].touched && f['username'].invalid">
        請輸入 3–32 個英文字母、數字、句點、底線或連字號
      </small>
    </div>

    <div class="login-field-group">
      <label for="password">密碼</label>
      <div class="input-shell">
        <span class="input-leading-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
        </span>
        <input type="password" id="password" formControlName="password" placeholder="至少 10 個字元"
          maxlength="128" [autocomplete]="isRegisterMode ? 'new-password' : 'current-password'" class="input-field" />
      </div>
      <small class="field-error" *ngIf="f['password'].touched && f['password'].invalid">
        密碼長度需為 10–128 個字元
      </small>
    </div>

    <div *ngIf="isRegisterMode" class="login-field-group">
      <label for="confirmPassword">再次輸入密碼</label>
      <div class="input-shell">
        <span class="input-leading-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 12 3 3 7-7"/><circle cx="12" cy="12" r="9"/></svg>
        </span>
        <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="再輸入一次密碼"
          maxlength="128" autocomplete="new-password" class="input-field" />
      </div>
    </div>

    <div *ngIf="errorMessage" class="error-wrapper" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>
      <span>{{ errorMessage }}</span>
    </div>

    <button type="submit" [disabled]="isSubmitting" class="login-btn">
      <span>{{ isSubmitting ? '處理中…' : (isRegisterMode ? '建立帳號並登入' : '登入') }}</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M14 7l5 5-5 5"/></svg>
    </button>
    <small class="security-note">密碼只會以不可逆雜湊保存；請使用未在其他網站使用過的密碼。</small>
  </form>
</div>
